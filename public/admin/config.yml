local_backend: true

backend:
  name: github
  repo: hamdong/hamlamadong
  branch: main
  base_url: https://hamlamadong.pages.dev
  auth_endpoint: /auth

media_library:
  name: cloudflare_r2
  bucket: 'hamlamadong-media'

# https://sveltiacms.app/en/docs/media/cloudflare-r2#configuration-properties
media_libraries:
  cloudflare_r2:
    account_id: 'ee96d608c9e713cb934f5281ceb2e00d'
    bucket: 'hamlamadong-media'
    access_key_id: 'e9df475878ee509ae637678e05b0342b'
    public_url: 'https://pub-1f7375d876ac4fa78065de9629e6a0c4.r2.dev'

# Media settings
media_folder: 'public/assets'
public_folder: '/assets'

collections:
  - name: 'blog'
    label: 'Blog'
    folder: 'src/content/blog'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Publish Date', name: 'date', widget: 'datetime' }
      - {
          label: 'Featured Image',
          name: 'image',
          widget: 'image',
          required: false,
        }
      - { label: 'Body', name: 'body', widget: 'markdown' }
      - {
          label: 'Card Excerpt (optional)',
          name: 'description',
          widget: 'string',
          required: false,
          hint: 'Shown on the latest-post card when no featured image is set.',
        }
      - { label: 'Draft', name: 'draft', widget: 'boolean', default: true }

  - name: 'art'
    label: 'Art'
    folder: 'src/content/art'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - { label: 'Artwork Title', name: 'title', widget: 'string' }
      - { label: 'Created / Post Date', name: 'date', widget: 'datetime' }
      - {
          label: 'Artwork File',
          name: 'image',
          widget: 'image',
          required: true,
        }
      - { label: 'Draft', name: 'draft', widget: 'boolean', default: false }

  - name: 'books'
    label: 'Books'
    folder: 'src/content/books'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - { label: 'Book Title', name: 'title', widget: 'string' }
      - { label: 'Post Date', name: 'date', widget: 'datetime' }
      - { label: 'Book Cover', name: 'image', widget: 'image', required: false }
      - { label: 'Your Thoughts (Body)', name: 'body', widget: 'markdown' }
      - {
          label: 'Rating (1-5)',
          name: 'rating',
          widget: 'number',
          min: 1,
          max: 5,
          required: false,
        }
      - { label: 'Draft', name: 'draft', widget: 'boolean', default: false }

  - name: 'games'
    label: 'Games'
    folder: 'src/content/games'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - { label: 'Game Title', name: 'title', widget: 'string' }
      - { label: 'Post Date', name: 'date', widget: 'datetime' }
      - {
          label: 'Game Art / Screenshot',
          name: 'image',
          widget: 'image',
          required: false,
        }
      - { label: 'Your Review (Body)', name: 'body', widget: 'markdown' }
      - {
          label: 'Rating (1-5)',
          name: 'rating',
          widget: 'number',
          min: 1,
          max: 5,
          required: false,
        }
      - { label: 'Draft', name: 'draft', widget: 'boolean', default: false }
