local_backend: true

backend:
  name: github
  repo: hamdong/hamlamadong
  branch: main
  base_url: https://hamlamadong-auth.hamlamadong.workers.dev
  auth_endpoint: /auth

media_library:
  name: cloudflare_r2

# https://sveltiacms.app/en/docs/media/cloudflare-r2#configuration-properties
media_libraries:
  cloudflare_r2:
    account_id: 'ee96d608c9e713cb934f5281ceb2e00d'
    bucket: 'hamlamadong-media'
    access_key_id: 'e9df475878ee509ae637678e05b0342b'
    public_url: 'https://pub-1f7375d876ac4fa78065de9629e6a0c4.r2.dev'

# Media settings
media_folder: 'public/assets'
public_folder: '/assets'

collections:
  - name: 'blog'
    label: 'Blog'
    folder: 'src/content/blog'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Publish Date', name: 'date', widget: 'datetime' }
      - { label: 'Description', name: 'description', widget: 'string' }
      - {
          label: 'Featured Image',
          name: 'image',
          widget: 'image',
          required: false,
        }
      - { label: 'Draft', name: 'draft', widget: 'boolean', default: true }
      - { label: 'Tags', name: 'tags', widget: 'list', default: ['Journal'] }
      - { label: 'Body', name: 'body', widget: 'markdown' }

  - name: 'art'
    label: 'Art'
    folder: 'src/content/art'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - { label: 'Artwork Title', name: 'title', widget: 'string' }
      - { label: 'Created / Post Date', name: 'date', widget: 'datetime' }
      - {
          label: 'Artwork File',
          name: 'image',
          widget: 'image',
          required: true,
        }
      - {
          label: 'Medium / Type',
          name: 'medium',
          widget: 'select',
          options: ['Digital', 'Traditional', 'Photography'],
          default: 'Digital',
        }
      - {
          label: 'Tools',
          name: 'tools',
          widget: 'list',
          required: false,
        }
      - { label: 'Draft', name: 'draft', widget: 'boolean', default: false }
      - { label: 'Tags', name: 'tags', widget: 'list', default: ['Art'] }
      - {
          label: 'Caption',
          name: 'description',
          widget: 'string',
          required: false,
        }
      - { label: 'Notes', name: 'body', widget: 'markdown', required: false }

  - name: 'reading'
    label: 'Reading List'
    folder: 'src/content/reading'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - { label: 'Book Title', name: 'title', widget: 'string' }
      - { label: 'Post Date', name: 'date', widget: 'datetime' }
      - {
          label: 'Status',
          name: 'status',
          widget: 'select',
          options: ['Reading', 'Finished'],
          default: 'Finished',
        }
      - {
          label: 'Date Finished',
          name: 'dateFinished',
          widget: 'datetime',
          required: false,
        }
      - {
          label: 'Rating (1-5)',
          name: 'rating',
          widget: 'number',
          min: 1,
          max: 5,
          required: false,
        }
      - { label: 'Book Cover', name: 'image', widget: 'image', required: false }
      - { label: 'Draft', name: 'draft', widget: 'boolean', default: false }
      - {
          label: 'Short Review',
          name: 'description',
          widget: 'string',
          required: false,
        }
      - {
          label: 'Your Thoughts (Body)',
          name: 'body',
          widget: 'markdown',
          required: false,
        }

  - name: 'games'
    label: 'Games'
    folder: 'src/content/games'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - { label: 'Game Title', name: 'title', widget: 'string' }
      - { label: 'Post Date', name: 'date', widget: 'datetime' }
      - {
          label: 'Platform',
          name: 'platform',
          widget: 'select',
          options: ['PC', 'PS5', 'Xbox', 'Switch', 'Mobile', 'Retro'],
          default: 'PC',
        }
      - {
          label: 'Status',
          name: 'status',
          widget: 'select',
          options:
            ['Playing', 'Completed', '100% Cleared', 'Backlog', 'Dropped'],
          default: 'Completed',
        }
      - {
          label: 'Rating (1-5)',
          name: 'rating',
          widget: 'number',
          min: 1,
          max: 5,
          required: false,
        }
      - {
          label: 'Game Art / Screenshot',
          name: 'image',
          widget: 'image',
          required: false,
        }
      - { label: 'Draft', name: 'draft', widget: 'boolean', default: false }
      - {
          label: 'Brief Summary',
          name: 'description',
          widget: 'string',
          required: false,
        }
      - {
          label: 'Your Review (Body)',
          name: 'body',
          widget: 'markdown',
          required: false,
        }
